<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook Model — One-Shot Graph</title>
<style>
:root { --osg-info:#1a1a1a; --osg-caption:#6b7280; --osg-decor:#e5e7eb; --osg-bg:#fff; --osg-active:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --osg-info:#f5f5f5; --osg-caption:#9ca3af; --osg-decor:#374151; --osg-bg:#0a0a0a; --osg-active:#60a5fa; } }
body { margin:0; padding:2rem; background:var(--osg-bg); font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:var(--osg-info); font-size:clamp(1.2rem,3vw,1.8rem); margin:0 0 0.5rem; font-weight:700; letter-spacing:-0.02em; }
.subtitle { color:var(--osg-caption); font-size:0.9rem; margin:0 0 1rem; }
.hint { color:var(--osg-caption); font-size:0.8rem; margin:0 0 1.5rem; font-style:italic; }
.osg-container { width:100%; max-width:550px; }
.stage-circle { fill: var(--osg-bg); stroke: var(--osg-info); stroke-width: 2.5; cursor: pointer; transition: all 0.3s; }
.stage-circle:hover, .stage-circle.active { stroke: var(--osg-active); stroke-width: 4; animation: osg-pulse 1s ease-in-out 2; }
@keyframes osg-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.stage-circle { transform-origin: center; transform-box: fill-box; }
.stage-label { fill: var(--osg-info); font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.stage-sub { fill: var(--osg-caption); font-size: 10px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-arrow { stroke: var(--osg-caption); stroke-width: 2; fill: none; marker-end: url(#hook-arrow); }
.center-text { fill: var(--osg-info); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
@media (prefers-reduced-motion: reduce) { .stage-circle:hover, .stage-circle.active { animation: none; } }
</style>
</head>
<body>
<h1>Hook Model — 습관 루프</h1>
<p class="subtitle">Trigger → Action → Reward → Investment</p>
<p class="hint">단계 클릭 시 활성화 (자동재생 ✗)</p>
<div class="osg-container">
<svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;" role="img" aria-label="Hook Model 4단계 순환">
<defs>
<marker id="hook-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="var(--osg-caption)"/>
</marker>
</defs>
<!-- 4단계 화살표 (반시계 외부 곡선) -->
<path d="M 250,110 A 140,140 0 0,1 390,250" class="flow-arrow"/>
<path d="M 390,250 A 140,140 0 0,1 250,390" class="flow-arrow"/>
<path d="M 250,390 A 140,140 0 0,1 110,250" class="flow-arrow"/>
<path d="M 110,250 A 140,140 0 0,1 250,110" class="flow-arrow"/>
<!-- 4 단계 -->
<g><circle class="stage-circle" cx="250" cy="110" r="60" onclick="this.classList.toggle('active')"/>
<text class="stage-label" x="250" y="100">TRIGGER</text>
<text class="stage-sub" x="250" y="120">트리거</text>
<text class="stage-sub" x="250" y="135" style="font-size:9px;">푸시·외부신호</text></g>
<g><circle class="stage-circle" cx="390" cy="250" r="60" onclick="this.classList.toggle('active')"/>
<text class="stage-label" x="390" y="240">ACTION</text>
<text class="stage-sub" x="390" y="260">액션</text>
<text class="stage-sub" x="390" y="275" style="font-size:9px;">최소 행동</text></g>
<g><circle class="stage-circle" cx="250" cy="390" r="60" onclick="this.classList.toggle('active')"/>
<text class="stage-label" x="250" y="380">REWARD</text>
<text class="stage-sub" x="250" y="400">보상</text>
<text class="stage-sub" x="250" y="415" style="font-size:9px;">가변적</text></g>
<g><circle class="stage-circle" cx="110" cy="250" r="60" onclick="this.classList.toggle('active')"/>
<text class="stage-label" x="110" y="240">INVEST</text>
<text class="stage-sub" x="110" y="260">투자</text>
<text class="stage-sub" x="110" y="275" style="font-size:9px;">사용자 투입</text></g>
<text class="center-text" x="250" y="245">HOOK</text>
<text class="center-text" x="250" y="265" style="font-size:11px; fill:var(--osg-caption);">습관 형성</text>
</svg>
</div>
</body>
</html>
