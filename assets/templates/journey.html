<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey Map — One-Shot Graph</title>
<style>
:root { --osg-info:#1a1a1a; --osg-caption:#6b7280; --osg-decor:#e5e7eb; --osg-bg:#fff; --osg-low:#dc2626; --osg-high:#16a34a; }
@media (prefers-color-scheme: dark) { :root { --osg-info:#f5f5f5; --osg-caption:#9ca3af; --osg-decor:#374151; --osg-bg:#0a0a0a; --osg-low:#f87171; --osg-high:#4ade80; } }
body { margin:0; padding:2rem; background:var(--osg-bg); font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:var(--osg-info); font-size:clamp(1.2rem,3vw,1.8rem); margin:0 0 1rem; font-weight:700; }
.subtitle { color:var(--osg-caption); font-size:0.9rem; margin:0 0 2rem; }
.osg-container { width:100%; max-width:800px; }
.stage-rect { fill: var(--osg-bg); stroke: var(--osg-decor); stroke-width: 1; }
.stage-label { fill: var(--osg-info); font-size: 12px; font-weight: 600; text-anchor: middle; }
/* MOTION OFF 안전 기본값: stroke-dashoffset: 0 → 곡선 항상 가시. 재가동 시 800으로 복원 */
.emotion-curve { stroke: var(--osg-info); stroke-width: 3; fill: none; stroke-dasharray: 800; stroke-dashoffset: 0; }
/* 재가동 시 아래 주석 해제:
.emotion-curve { stroke-dashoffset: 800; animation: draw 3s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
*/
.emotion-point { fill: var(--osg-info); stroke: var(--osg-bg); stroke-width: 2; }
.emotion-point.low { fill: var(--osg-low); /* animation: blink 1.5s ease-in-out infinite; — MOTION OFF */ }
.emotion-point.high { fill: var(--osg-high); }
/* @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } } — MOTION OFF 보존 */
.emotion-label { font-size: 10px; fill: var(--osg-caption); text-anchor: middle; }
.axis-label { fill: var(--osg-caption); font-size: 10px; }
@media (prefers-reduced-motion: reduce) { .emotion-curve { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<h1>Experience Journey Map — 경험 흐름</h1>
<p class="subtitle">시간축 + 감정 곡선 + 이탈 포인트</p>
<div class="osg-container">
<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;" role="img" aria-label="Customer Journey 감정 곡선">
<!-- 단계 박스 -->
<rect class="stage-rect" x="50" y="50" width="140" height="40"/><text class="stage-label" x="120" y="75">인지</text>
<rect class="stage-rect" x="195" y="50" width="140" height="40"/><text class="stage-label" x="265" y="75">고려</text>
<rect class="stage-rect" x="340" y="50" width="140" height="40"/><text class="stage-label" x="410" y="75">구매</text>
<rect class="stage-rect" x="485" y="50" width="140" height="40"/><text class="stage-label" x="555" y="75">사용</text>
<rect class="stage-rect" x="630" y="50" width="140" height="40"/><text class="stage-label" x="700" y="75">옹호</text>
<!-- 감정축 가이드 -->
<line x1="50" y1="220" x2="770" y2="220" stroke="var(--osg-decor)" stroke-dasharray="4,4"/>
<text class="axis-label" x="30" y="140" text-anchor="end">😀</text>
<text class="axis-label" x="30" y="225" text-anchor="end">😐</text>
<text class="axis-label" x="30" y="310" text-anchor="end">😞</text>
<!-- 감정 곡선 (S 자) -->
<path class="emotion-curve" d="M 120,180 Q 200,140 265,160 T 410,280 T 555,200 T 700,130"/>
<!-- 감정 포인트 -->
<circle class="emotion-point high" cx="120" cy="180" r="6"/>
<circle class="emotion-point" cx="265" cy="160" r="6"/>
<circle class="emotion-point low" cx="410" cy="280" r="8"/>
<text class="emotion-label" x="410" y="305">⚠️ 결제 이탈</text>
<circle class="emotion-point" cx="555" cy="200" r="6"/>
<circle class="emotion-point high" cx="700" cy="130" r="6"/>
<!-- 페인포인트 라벨 -->
<text class="emotion-label" x="120" y="365">광고 노출</text>
<text class="emotion-label" x="265" y="365">리뷰 검색</text>
<text class="emotion-label" x="410" y="365">결제 단계</text>
<text class="emotion-label" x="555" y="365">제품 사용</text>
<text class="emotion-label" x="700" y="365">SNS 공유</text>
</svg>
</div>
</body>
</html>
