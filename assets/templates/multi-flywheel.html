<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Flywheel — One-Shot Graph</title>
<style>
:root { --osg-info:#1a1a1a; --osg-caption:#6b7280; --osg-decor:#e5e7eb; --osg-bg:#fff; --osg-w1:#2563eb; --osg-w2:#16a34a; --osg-w3:#dc2626; }
@media (prefers-color-scheme: dark) { :root { --osg-info:#f5f5f5; --osg-caption:#9ca3af; --osg-decor:#374151; --osg-bg:#0a0a0a; --osg-w1:#60a5fa; --osg-w2:#4ade80; --osg-w3:#f87171; } }
body { margin:0; padding:2rem; background:var(--osg-bg); font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:var(--osg-info); font-size:clamp(1.2rem,3vw,1.8rem); margin:0 0 1rem; font-weight:700; }
.subtitle { color:var(--osg-caption); font-size:0.9rem; margin:0 0 2rem; }
.osg-container { width:100%; max-width:700px; }
.wheel { transform-box: fill-box; transform-origin: center; }
.wheel.w1 { animation: spin1 25s linear infinite; }
.wheel.w2 { animation: spin2 30s linear infinite reverse; }
.wheel.w3 { animation: spin3 35s linear infinite; }
@keyframes spin1 { to { transform: rotate(360deg); } }
@keyframes spin2 { to { transform: rotate(360deg); } }
@keyframes spin3 { to { transform: rotate(360deg); } }
.connector { stroke-width: 2; fill: none; stroke-dasharray: 5,5; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
.wheel-label { font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.node-text { font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: var(--osg-bg); font-weight:600; }
.node-circle { stroke-width: 2; }
@media (prefers-reduced-motion: reduce) { .wheel { animation: none; } .connector { animation: none; opacity: 0.5; } }
</style>
</head>
<body>
<h1>Multi-Flywheel — 시스템 성장</h1>
<p class="subtitle">3개 플라이휠 상호강화 (크리에이터·팬·플랫폼)</p>
<div class="osg-container">
<svg viewBox="0 0 700 500" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;" role="img" aria-label="Multi-Flywheel 3축 시스템">
<!-- W1: 크리에이터 (좌상) -->
<g class="wheel w1" style="transform-origin: 180px 180px;">
<circle cx="180" cy="180" r="80" fill="none" stroke="var(--osg-w1)" stroke-width="2" stroke-opacity="0.3"/>
<circle class="node-circle" cx="180" cy="100" r="22" fill="var(--osg-w1)" stroke="var(--osg-w1)"/><text class="node-text" x="180" y="100">제작</text>
<circle class="node-circle" cx="260" cy="180" r="22" fill="var(--osg-w1)" stroke="var(--osg-w1)"/><text class="node-text" x="260" y="180">수익</text>
<circle class="node-circle" cx="180" cy="260" r="22" fill="var(--osg-w1)" stroke="var(--osg-w1)"/><text class="node-text" x="180" y="260">투자</text>
<circle class="node-circle" cx="100" cy="180" r="22" fill="var(--osg-w1)" stroke="var(--osg-w1)"/><text class="node-text" x="100" y="180">품질↑</text>
</g>
<text class="wheel-label" x="180" y="180" fill="var(--osg-w1)">CREATOR</text>
<!-- W2: 팬 (우상) -->
<g class="wheel w2" style="transform-origin: 520px 180px;">
<circle cx="520" cy="180" r="80" fill="none" stroke="var(--osg-w2)" stroke-width="2" stroke-opacity="0.3"/>
<circle class="node-circle" cx="520" cy="100" r="22" fill="var(--osg-w2)" stroke="var(--osg-w2)"/><text class="node-text" x="520" y="100">발견</text>
<circle class="node-circle" cx="600" cy="180" r="22" fill="var(--osg-w2)" stroke="var(--osg-w2)"/><text class="node-text" x="600" y="180">소비</text>
<circle class="node-circle" cx="520" cy="260" r="22" fill="var(--osg-w2)" stroke="var(--osg-w2)"/><text class="node-text" x="520" y="260">결제</text>
<circle class="node-circle" cx="440" cy="180" r="22" fill="var(--osg-w2)" stroke="var(--osg-w2)"/><text class="node-text" x="440" y="180">공유</text>
</g>
<text class="wheel-label" x="520" y="180" fill="var(--osg-w2)">FAN</text>
<!-- W3: 플랫폼 (하단) -->
<g class="wheel w3" style="transform-origin: 350px 380px;">
<circle cx="350" cy="380" r="80" fill="none" stroke="var(--osg-w3)" stroke-width="2" stroke-opacity="0.3"/>
<circle class="node-circle" cx="350" cy="300" r="22" fill="var(--osg-w3)" stroke="var(--osg-w3)"/><text class="node-text" x="350" y="300">도구</text>
<circle class="node-circle" cx="430" cy="380" r="22" fill="var(--osg-w3)" stroke="var(--osg-w3)"/><text class="node-text" x="430" y="380">데이터</text>
<circle class="node-circle" cx="350" cy="460" r="22" fill="var(--osg-w3)" stroke="var(--osg-w3)"/><text class="node-text" x="350" y="460">매칭</text>
<circle class="node-circle" cx="270" cy="380" r="22" fill="var(--osg-w3)" stroke="var(--osg-w3)"/><text class="node-text" x="270" y="380">신뢰</text>
</g>
<text class="wheel-label" x="350" y="380" fill="var(--osg-w3)">PLATFORM</text>
<!-- 휠간 연결 (펄스) -->
<line class="connector" x1="260" y1="180" x2="440" y2="180" stroke="var(--osg-info)"/>
<line class="connector" x1="220" y1="240" x2="320" y2="320" stroke="var(--osg-info)" style="animation-delay:0.5s"/>
<line class="connector" x1="480" y1="240" x2="380" y2="320" stroke="var(--osg-info)" style="animation-delay:1s"/>
<text x="350" y="170" fill="var(--osg-caption)" font-size="10" text-anchor="middle">콘텐츠↔팬</text>
<text x="240" y="295" fill="var(--osg-caption)" font-size="10" text-anchor="middle">툴 제공</text>
<text x="460" y="295" fill="var(--osg-caption)" font-size="10" text-anchor="middle">매칭 제공</text>
</svg>
</div>
</body>
</html>
