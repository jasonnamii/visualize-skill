<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funnel — One-Shot Graph</title>
<style>
:root { --osg-info:#1a1a1a; --osg-caption:#6b7280; --osg-decor:#e5e7eb; --osg-bg:#fff; --osg-leak:#dc2626; }
@media (prefers-color-scheme: dark) { :root { --osg-info:#f5f5f5; --osg-caption:#9ca3af; --osg-decor:#374151; --osg-bg:#0a0a0a; --osg-leak:#f87171; } }
body { margin:0; padding:2rem; background:var(--osg-bg); font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:var(--osg-info); font-size:clamp(1.2rem,3vw,1.8rem); margin:0 0 1rem; font-weight:700; letter-spacing:-0.02em; }
.subtitle { color:var(--osg-caption); font-size:0.9rem; margin:0 0 2rem; }
.osg-container { width:100%; max-width:500px; }
.stage { fill: var(--osg-info); opacity: 0.85; }
.stage-label { fill: var(--osg-bg); font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
.conversion { fill: var(--osg-caption); font-size: 11px; text-anchor: start; }
.leak-label { fill: var(--osg-leak); font-size: 11px; text-anchor: end; font-weight: 600; }
/* MOTION OFF: 입자는 장식 요소 — 정적 모드에선 숨김. 재가동 시 display 제거 + animation 복원 */
.flow-particle { fill: var(--osg-info); opacity: 0; display: none; }
/* 재가동 시 아래 복원:
.flow-particle { opacity: 0.6; display: inline; animation: flow 2.5s linear infinite; }
@keyframes flow { 0% { transform: translateY(-20px); opacity:0; } 20% { opacity:1; } 80% { opacity:1; } 100% { transform: translateY(420px); opacity:0; } }
*/
@media (prefers-reduced-motion: reduce) { .flow-particle { display: none; } }
@media print { .flow-particle { display: none; } }
</style>
</head>
<body>
<h1>Funnel — 누수 진단</h1>
<p class="subtitle">상→하 흐름, 단계별 잔존율 = 너비</p>
<div class="osg-container">
<svg viewBox="0 0 500 480" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;" role="img" aria-label="Funnel 다이어그램: 5단계 전환율 시각화">
<!-- 흐름 입자 -->
<circle class="flow-particle" cx="250" cy="0" r="3" style="animation-delay:0s"/>
<circle class="flow-particle" cx="240" cy="0" r="3" style="animation-delay:0.5s"/>
<circle class="flow-particle" cx="260" cy="0" r="3" style="animation-delay:1s"/>
<circle class="flow-particle" cx="245" cy="0" r="3" style="animation-delay:1.5s"/>
<circle class="flow-particle" cx="255" cy="0" r="3" style="animation-delay:2s"/>
<!-- 5단계 사다리꼴 -->
<polygon class="stage" points="50,20 450,20 410,90 90,90"/>
<text class="stage-label" x="250" y="55">인지 (10,000)</text>
<text class="conversion" x="460" y="60">100%</text>
<polygon class="stage" points="90,100 410,100 370,170 130,170"/>
<text class="stage-label" x="250" y="135">유입 (4,000)</text>
<text class="conversion" x="380" y="140">40%</text>
<text class="leak-label" x="120" y="140">↓ 60% 이탈</text>
<polygon class="stage" points="130,180 370,180 330,250 170,250"/>
<text class="stage-label" x="250" y="215">가입 (1,200)</text>
<text class="conversion" x="340" y="220">30%</text>
<text class="leak-label" x="160" y="220">↓ 70% 이탈</text>
<polygon class="stage" points="170,260 330,260 290,330 210,330"/>
<text class="stage-label" x="250" y="295">전환 (360)</text>
<text class="conversion" x="300" y="300">30%</text>
<text class="leak-label" x="200" y="300">↓ 70% 이탈</text>
<polygon class="stage" points="210,340 290,340 260,410 240,410"/>
<text class="stage-label" x="250" y="375">결제</text>
<text class="conversion" x="270" y="380">36%</text>
<text class="leak-label" x="230" y="380">↓ 64%</text>
<text x="250" y="450" fill="var(--osg-info)" font-size="14" text-anchor="middle" font-weight="600">결제 130 / 누수 9,870</text>
</svg>
</div>
</body>
</html>
