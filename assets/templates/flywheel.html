<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flywheel — One-Shot Graph</title>
<style>
:root {
  --osg-info: #1a1a1a;
  --osg-caption: #6b7280;
  --osg-decor: #e5e7eb;
  --osg-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --osg-info: #f5f5f5; --osg-caption: #9ca3af; --osg-decor: #374151; --osg-bg: #0a0a0a; }
}
body { margin:0; padding:2rem; background:var(--osg-bg); font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:var(--osg-info); font-size:clamp(1.2rem,3vw,1.8rem); margin:0 0 1rem; font-weight:700; letter-spacing:-0.02em; }
.subtitle { color:var(--osg-caption); font-size:0.9rem; margin:0 0 2rem; }
.osg-container { width:100%; max-width:600px; }
.osg-flywheel { transform-origin: center center; animation: osg-rotate 30s linear infinite; }
@keyframes osg-rotate { to { transform: rotate(360deg); } }
.node-circle { fill: var(--osg-bg); stroke: var(--osg-info); stroke-width: 2; }
.node-text { fill: var(--osg-info); font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
.flow-arrow { stroke: var(--osg-caption); stroke-width: 2; fill: none; marker-end: url(#osg-arrow); }
.center-text { fill: var(--osg-info); font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
@media (prefers-reduced-motion: reduce) { .osg-flywheel { animation: none; } }
@media print { .osg-flywheel { animation: none; } }
</style>
</head>
<body>
<h1>Flywheel — 선순환 작동원리</h1>
<p class="subtitle">중심축 회전 = 자기강화 루프</p>
<div class="osg-container">
<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;" role="img" aria-label="Flywheel 다이어그램: 4개 노드가 순환하는 선순환 구조">
<defs>
<marker id="osg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="var(--osg-caption)"/>
</marker>
</defs>
<g class="osg-flywheel">
<!-- 곡선 화살표 (시계방향 순환) -->
<path d="M 200,80 A 120,120 0 0,1 320,200" class="flow-arrow"/>
<path d="M 320,200 A 120,120 0 0,1 200,320" class="flow-arrow"/>
<path d="M 200,320 A 120,120 0 0,1 80,200" class="flow-arrow"/>
<path d="M 80,200 A 120,120 0 0,1 200,80" class="flow-arrow"/>
<!-- 4개 노드 (12·3·6·9시 방향) -->
<g><circle class="node-circle" cx="200" cy="80" r="40"/><text class="node-text" x="200" y="80">선택폭↑</text></g>
<g><circle class="node-circle" cx="320" cy="200" r="40"/><text class="node-text" x="320" y="200">고객경험↑</text></g>
<g><circle class="node-circle" cx="200" cy="320" r="40"/><text class="node-text" x="200" y="320">트래픽↑</text></g>
<g><circle class="node-circle" cx="80" cy="200" r="40"/><text class="node-text" x="80" y="200">판매자↑</text></g>
</g>
<!-- 중심 라벨 (회전 안 함) -->
<text class="center-text" x="200" y="195">성장</text>
<text class="center-text" x="200" y="220" style="font-size:12px; fill:var(--osg-caption);">FLYWHEEL</text>
</svg>
</div>
</body>
</html>
