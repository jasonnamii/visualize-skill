<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-sided Market — One-Shot Graph</title>
<style>
:root { --osg-info:#1a1a1a; --osg-caption:#6b7280; --osg-decor:#e5e7eb; --osg-bg:#fff; --osg-supply:#2563eb; --osg-demand:#dc2626; }
@media (prefers-color-scheme: dark) { :root { --osg-info:#f5f5f5; --osg-caption:#9ca3af; --osg-decor:#374151; --osg-bg:#0a0a0a; --osg-supply:#60a5fa; --osg-demand:#f87171; } }
body { margin:0; padding:2rem; background:var(--osg-bg); font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:var(--osg-info); font-size:clamp(1.2rem,3vw,1.8rem); margin:0 0 1rem; font-weight:700; }
.subtitle { color:var(--osg-caption); font-size:0.9rem; margin:0 0 2rem; }
.osg-container { width:100%; max-width:600px; }
.side-circle { stroke-width: 3; fill-opacity: 0.1; }
.platform-circle { fill: var(--osg-info); }
.platform-text { fill: var(--osg-bg); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.side-label { font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.flow-line { fill: none; stroke-width: 2; stroke-dasharray: 6,4; }
.flow-line.supply { stroke: var(--osg-supply); animation: flow-right 3s linear infinite; }
.flow-line.demand { stroke: var(--osg-demand); animation: flow-left 3s linear infinite; }
@keyframes flow-right { to { stroke-dashoffset: -100; } }
@keyframes flow-left { to { stroke-dashoffset: 100; } }
.value-text { fill: var(--osg-caption); font-size: 11px; text-anchor: middle; }
@media (prefers-reduced-motion: reduce) { .flow-line { animation: none; } }
</style>
</head>
<body>
<h1>Two-sided Market — 양면 네트워크</h1>
<p class="subtitle">공급자 ↔ 플랫폼 ↔ 수요자 상호 강화</p>
<div class="osg-container">
<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;" role="img" aria-label="Two-sided Market 양면 구조">
<!-- 공급자 (좌) -->
<circle class="side-circle" cx="100" cy="200" r="80" stroke="var(--osg-supply)" fill="var(--osg-supply)"/>
<text class="side-label" x="100" y="195" fill="var(--osg-supply)">공급자</text>
<text class="side-label" x="100" y="215" style="font-size:10px;" fill="var(--osg-caption)">SUPPLY</text>
<!-- 수요자 (우) -->
<circle class="side-circle" cx="500" cy="200" r="80" stroke="var(--osg-demand)" fill="var(--osg-demand)"/>
<text class="side-label" x="500" y="195" fill="var(--osg-demand)">수요자</text>
<text class="side-label" x="500" y="215" style="font-size:10px;" fill="var(--osg-caption)">DEMAND</text>
<!-- 플랫폼 (중앙) -->
<circle class="platform-circle" cx="300" cy="200" r="50"/>
<text class="platform-text" x="300" y="195">PLATFORM</text>
<text class="platform-text" x="300" y="215" style="font-size:10px;">플랫폼</text>
<!-- 양방향 흐름 -->
<path class="flow-line supply" d="M 180,180 L 250,180"/>
<path class="flow-line supply" d="M 350,180 L 420,180"/>
<text class="value-text" x="215" y="170">상품·서비스</text>
<text class="value-text" x="385" y="170">→ 노출·고객</text>
<path class="flow-line demand" d="M 420,220 L 350,220"/>
<path class="flow-line demand" d="M 250,220 L 180,220"/>
<text class="value-text" x="385" y="240">결제·수요</text>
<text class="value-text" x="215" y="240">→ 매출·데이터</text>
<!-- 네트워크 효과 라벨 -->
<text x="300" y="100" fill="var(--osg-info)" font-size="14" font-weight="600" text-anchor="middle">교차 네트워크 효과</text>
<text x="300" y="120" fill="var(--osg-caption)" font-size="11" text-anchor="middle">한쪽 늘면 다른 쪽 가치 ↑</text>
<text x="300" y="320" fill="var(--osg-caption)" font-size="11" text-anchor="middle">닭-달걀 문제 = 한쪽 먼저 임계량 확보</text>
</svg>
</div>
</body>
</html>
